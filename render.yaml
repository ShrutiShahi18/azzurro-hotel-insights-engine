services:
  - type: web
    name: azzurroiq-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./artifacts/api-server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: azzurroiq-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_INTEGRATIONS_OPENAI_API_KEY
        sync: false
      - key: AI_INTEGRATIONS_OPENAI_BASE_URL
        value: https://api.openai.com/v1

  - type: web
    name: azzurroiq-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "80"

databases:
  - name: azzurroiq-db
    plan: free
    region: singapore
    databaseName: azzurroiq
    user: azzurro
    postgresMajorVersion: "16"