services:
  db:
    image: postgres:16-alpine
    container_name: azzurroiq-db-compose
    environment:
      POSTGRES_USER: azzurro
      POSTGRES_PASSWORD: REMOVED_SECRET
      POSTGRES_DB: azzurroiq
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U azzurro -d azzurroiq"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: azzurroiq-api:latest
    container_name: azzurroiq-api-compose
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://azzurro:REMOVED_SECRET@db:5432/azzurroiq
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    image: azzurroiq-frontend:latest
    container_name: azzurroiq-frontend-compose
    depends_on:
      - api
    ports:
      - "8081:80"
    restart: unless-stopped

volumes:
  postgres_data: