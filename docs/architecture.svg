<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 560" width="820" height="560" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrow-dark" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f2a4d" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="820" height="560" fill="#f8f9fc" rx="12"/>

  <!-- ═══════════════════ LAYER 1: BROWSER ═══════════════════ -->
  <rect x="30" y="24" width="760" height="154" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <!-- Layer label -->
  <rect x="30" y="24" width="760" height="36" rx="10" fill="#0f2a4d"/>
  <rect x="30" y="48" width="760" height="12" fill="#0f2a4d"/>
  <text x="52" y="47" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="0.3">Browser</text>
  <text x="160" y="47" font-size="11" fill="#94a3b8">React 18 + Vite</text>

  <!-- 4 page cards -->
  <!-- Dashboard -->
  <rect x="52" y="72" width="152" height="72" rx="7" fill="#f0f4ff" stroke="#c7d7fa" stroke-width="1.2"/>
  <text x="128" y="96" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">Dashboard</text>
  <text x="128" y="111" font-size="10" fill="#4a6fa5" text-anchor="middle">Portfolio KPIs</text>
  <text x="128" y="125" font-size="10" fill="#4a6fa5" text-anchor="middle">Rating Trends</text>

  <!-- Reviews Feed -->
  <rect x="226" y="72" width="152" height="72" rx="7" fill="#f0f4ff" stroke="#c7d7fa" stroke-width="1.2"/>
  <text x="302" y="96" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">Reviews Feed</text>
  <text x="302" y="111" font-size="10" fill="#4a6fa5" text-anchor="middle">Paginated + filtered</text>
  <text x="302" y="125" font-size="10" fill="#4a6fa5" text-anchor="middle">Sentiment tags</text>

  <!-- Property Drilldown -->
  <rect x="400" y="72" width="152" height="72" rx="7" fill="#f0f4ff" stroke="#c7d7fa" stroke-width="1.2"/>
  <text x="476" y="96" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">Property Drilldown</text>
  <text x="476" y="111" font-size="10" fill="#4a6fa5" text-anchor="middle">Per-hotel analytics</text>
  <text x="476" y="125" font-size="10" fill="#4a6fa5" text-anchor="middle">Complaint topics</text>

  <!-- Insights Panel -->
  <rect x="574" y="72" width="196" height="72" rx="7" fill="#f0f4ff" stroke="#c7d7fa" stroke-width="1.2"/>
  <text x="672" y="96" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">Insights Panel</text>
  <text x="672" y="111" font-size="10" fill="#4a6fa5" text-anchor="middle">AI summaries</text>
  <text x="672" y="125" font-size="10" fill="#4a6fa5" text-anchor="middle">Recommendations</text>

  <!-- React Query bar -->
  <rect x="52" y="156" width="718" height="14" rx="4" fill="#e8f0fe" stroke="#c7d7fa" stroke-width="1"/>
  <text x="411" y="167" font-size="10" fill="#3b5bdb" text-anchor="middle" font-weight="500">React Query hooks · auto-generated by Orval from OpenAPI spec</text>

  <!-- ═══════════════════ CONNECTOR: Browser → API ═══════════════════ -->
  <line x1="411" y1="178" x2="411" y2="210" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <rect x="332" y="186" width="160" height="18" rx="4" fill="#f8f9fc"/>
  <text x="412" y="199" font-size="10" fill="#64748b" text-anchor="middle" font-weight="500">HTTP / REST  ·  JSON</text>

  <!-- ═══════════════════ LAYER 2: API SERVER ═══════════════════ -->
  <rect x="30" y="210" width="760" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="210" width="760" height="36" rx="10" fill="#1e3a6e"/>
  <rect x="30" y="234" width="760" height="12" fill="#1e3a6e"/>
  <text x="52" y="233" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="0.3">API Server</text>
  <text x="170" y="233" font-size="11" fill="#94a3b8">Node.js · Express 5 · port 8080</text>

  <!-- Route cards -->
  <rect x="52" y="258" width="138" height="62" rx="7" fill="#f8faff" stroke="#dde6f7" stroke-width="1.2"/>
  <text x="121" y="278" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">GET /hotels</text>
  <text x="121" y="294" font-size="10" fill="#4a6fa5" text-anchor="middle">List · Detail</text>
  <text x="121" y="308" font-size="10" fill="#4a6fa5" text-anchor="middle">+ computed stats</text>

  <rect x="206" y="258" width="138" height="62" rx="7" fill="#f8faff" stroke="#dde6f7" stroke-width="1.2"/>
  <text x="275" y="278" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">POST /reviews</text>
  <text x="275" y="294" font-size="10" fill="#4a6fa5" text-anchor="middle">Paginate · filter</text>
  <text x="275" y="308" font-size="10" fill="#4a6fa5" text-anchor="middle">Import · dedupe</text>

  <rect x="360" y="258" width="138" height="62" rx="7" fill="#f8faff" stroke="#dde6f7" stroke-width="1.2"/>
  <text x="429" y="278" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">GET /analytics</text>
  <text x="429" y="294" font-size="10" fill="#4a6fa5" text-anchor="middle">Overview · trends</text>
  <text x="429" y="308" font-size="10" fill="#4a6fa5" text-anchor="middle">Sentiment · topics</text>

  <rect x="514" y="258" width="138" height="62" rx="7" fill="#f8faff" stroke="#dde6f7" stroke-width="1.2"/>
  <text x="583" y="278" font-size="11" font-weight="600" fill="#1e3a6e" text-anchor="middle">POST /insights</text>
  <text x="583" y="294" font-size="10" fill="#4a6fa5" text-anchor="middle">List · Generate</text>
  <text x="583" y="308" font-size="10" fill="#4a6fa5" text-anchor="middle">AI + fallback</text>

  <!-- Cross-cutting concerns bar -->
  <rect x="52" y="330" width="718" height="36" rx="5" fill="#fafbff" stroke="#dde6f7" stroke-width="1"/>
  <text x="160" y="348" font-size="10" fill="#3b5bdb" font-weight="600">Zod validation</text>
  <text x="160" y="360" font-size="9" fill="#64748b">auto-generated from OpenAPI</text>
  <line x1="280" y1="334" x2="280" y2="362" stroke="#dde6f7" stroke-width="1"/>
  <text x="390" y="348" font-size="10" fill="#3b5bdb" font-weight="600" text-anchor="middle">Drizzle ORM</text>
  <text x="390" y="360" font-size="9" fill="#64748b" text-anchor="middle">type-safe queries · schema push</text>
  <line x1="500" y1="334" x2="500" y2="362" stroke="#dde6f7" stroke-width="1"/>
  <text x="622" y="348" font-size="10" fill="#3b5bdb" font-weight="600" text-anchor="middle">Pino logger</text>
  <text x="622" y="360" font-size="9" fill="#64748b" text-anchor="middle">structured JSON logs</text>

  <!-- ═══════════════════ CONNECTORS: API → DBs ═══════════════════ -->
  <!-- Left: API → PostgreSQL -->
  <line x1="280" y1="378" x2="220" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Right: API → OpenAI (from insights route) -->
  <line x1="583" y1="378" x2="630" y2="420" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ LAYER 3: DATASTORES ═══════════════════ -->
  <!-- PostgreSQL -->
  <rect x="30" y="420" width="410" height="116" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="420" width="410" height="36" rx="10" fill="#336791"/>
  <rect x="30" y="444" width="410" height="12" fill="#336791"/>
  <text x="52" y="443" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="0.3">PostgreSQL</text>
  <text x="170" y="443" font-size="11" fill="#a8c8e8">managed by Drizzle ORM</text>

  <!-- Table chips -->
  <rect x="50" y="464" width="100" height="54" rx="6" fill="#f0f7ff" stroke="#c7dff7" stroke-width="1"/>
  <text x="100" y="482" font-size="10" font-weight="700" fill="#336791" text-anchor="middle">hotels</text>
  <text x="100" y="496" font-size="9" fill="#4a6fa5" text-anchor="middle">id · name · slug</text>
  <text x="100" y="509" font-size="9" fill="#4a6fa5" text-anchor="middle">location · stars</text>

  <rect x="165" y="464" width="110" height="54" rx="6" fill="#f0f7ff" stroke="#c7dff7" stroke-width="1"/>
  <text x="220" y="482" font-size="10" font-weight="700" fill="#336791" text-anchor="middle">reviews</text>
  <text x="220" y="496" font-size="9" fill="#4a6fa5" text-anchor="middle">rating · sentiment</text>
  <text x="220" y="509" font-size="9" fill="#4a6fa5" text-anchor="middle">topics · externalId</text>

  <rect x="290" y="464" width="132" height="54" rx="6" fill="#f0f7ff" stroke="#c7dff7" stroke-width="1"/>
  <text x="356" y="482" font-size="10" font-weight="700" fill="#336791" text-anchor="middle">insights</text>
  <text x="356" y="496" font-size="9" fill="#4a6fa5" text-anchor="middle">type · title · content</text>
  <text x="356" y="509" font-size="9" fill="#4a6fa5" text-anchor="middle">metric · generatedAt</text>

  <!-- OpenAI -->
  <rect x="460" y="420" width="330" height="116" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="460" y="420" width="330" height="36" rx="10" fill="#412991"/>
  <rect x="460" y="444" width="330" height="12" fill="#412991"/>
  <text x="482" y="443" font-size="13" font-weight="600" fill="#ffffff" letter-spacing="0.3">OpenAI API</text>
  <text x="600" y="443" font-size="11" fill="#b5a4e8">GPT · insight generation</text>

  <!-- AI info chips -->
  <rect x="478" y="464" width="136" height="54" rx="6" fill="#f5f0ff" stroke="#d8c8f5" stroke-width="1"/>
  <text x="546" y="479" font-size="10" font-weight="700" fill="#412991" text-anchor="middle">Prompt</text>
  <text x="546" y="494" font-size="9" fill="#6b48c8" text-anchor="middle">30 reviews sample</text>
  <text x="546" y="507" font-size="9" fill="#6b48c8" text-anchor="middle">+ stats + hotel name</text>

  <rect x="628" y="464" width="144" height="54" rx="6" fill="#f5f0ff" stroke="#d8c8f5" stroke-width="1"/>
  <text x="700" y="479" font-size="10" font-weight="700" fill="#412991" text-anchor="middle">Response</text>
  <text x="700" y="494" font-size="9" fill="#6b48c8" text-anchor="middle">summary · alert</text>
  <text x="700" y="507" font-size="9" fill="#6b48c8" text-anchor="middle">recommendation</text>

  <!-- Fallback badge -->
  <rect x="478" y="524" width="294" height="6" rx="3" fill="#fef3c7"/>
  <text x="625" y="533" font-size="9" fill="#92400e" text-anchor="middle">⚡ rule-based fallback if API unavailable</text>

  <!-- ═══════════════════ CODEGEN SIDEBAR NOTE ═══════════════════ -->
  <rect x="30" y="544" width="760" height="10" rx="4" fill="none"/>
  <text x="411" y="553" font-size="9.5" fill="#94a3b8" text-anchor="middle">OpenAPI spec (lib/api-spec/) → Orval → React Query hooks (lib/api-client-react/) + Zod validators (lib/api-zod/)</text>
</svg>
