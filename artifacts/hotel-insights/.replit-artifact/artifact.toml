kind = "web"
previewPath = "/"
title = "AzzurroIQ"
description = "Guest review analytics dashboard for Azzurro Hotels Sydney. Aggregates reviews across 4 properties, surfaces AI-powered insights, sentiment trends, and complaint categories for hotel operations teams."
version = "1.0.0"
id = "artifacts/hotel-insights"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20187

[services.development]
run = "pnpm --filter @workspace/hotel-insights run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hotel-insights", "run", "build" ]
serve = "static"
publicDir = "artifacts/hotel-insights/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20187"
BASE_PATH = "/"
